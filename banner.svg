<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b12" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#080b12" />
    </linearGradient>

    <!-- Animated Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#38bdf8;#818cf8;#c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.45" />
    </linearGradient>

    <!-- Subtle Ambient Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="900" height="240" rx="16" fill="url(#bgGrad)" />
  <rect width="900" height="240" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Ambient Glowing Blobs -->
  <circle cx="160" cy="50" r="95" fill="#0284c7" opacity="0.22" filter="url(#glow)" />
  <circle cx="740" cy="180" r="105" fill="#7c3aed" opacity="0.2" filter="url(#glow)" />
  <circle cx="450" cy="120" r="80" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />

  <!-- Top Accent Glowing Strip -->
  <rect x="120" y="0" width="660" height="2.5" rx="1.25" fill="url(#titleGrad)" />

  <!-- Status Capsule Badge -->
  <g transform="translate(450, 64)">
    <rect x="-165" y="-14" width="330" height="28" rx="14" fill="#131b2e" stroke="#1e293b" stroke-width="1" />
    <circle cx="-142" cy="0" r="4.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <text text-anchor="middle" y="4" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="2.8">SYSTEMS &amp; LINUX DESKTOP ARCHITECT</text>
  </g>

  <!-- Main Animated Name Title -->
  <text x="450" y="132" text-anchor="middle" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="5">ARKA</text>

  <!-- High-Tech Subtitle -->
  <text x="450" y="166" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" letter-spacing="0.5">Crafting fluid, high-performance desktop experiences for Arch Linux &amp; Wayland</text>

  <!-- Modern Tech Badges Bottom Row -->
  <g transform="translate(450, 204)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#94a3b8">
    <text text-anchor="middle">
      <tspan fill="#38bdf8">◆</tspan> Arch Linux
      <tspan dx="16" fill="#818cf8">◆</tspan> Hyprland Compositor
      <tspan dx="16" fill="#c084fc">◆</tspan> GTK4 / Libadwaita
      <tspan dx="16" fill="#38bdf8">◆</tspan> Docker OCI
    </text>
  </g>
</svg>
